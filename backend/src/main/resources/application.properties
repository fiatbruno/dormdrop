
# Application name
spring.application.name=dormdrop

# MongoDB configuration
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=dormdrop
spring.mongodb.auto-index-creation=true

# Common prefix for REST API endpoints
api.prefix=/api/v1

# JWT authentication
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Administrator account
project.admin.email=${ADMIN_EMAIL:admin1@augustana.edu}
project.admin.password=${ADMIN_PASSWORD:admin}
project.admin.name=${ADMIN_NAME:Administrator}

# Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Image upload configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads
