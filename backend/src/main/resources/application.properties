# Change this to your actual project name.
spring.application.name=dormdrop

# MongoDB configuration. Change details to match your MongoDB cluster.
spring.mongodb.uri=${MONGODB_URI}

spring.mongodb.database=dormdrop

# Common prefix for all REST API endpoints.
api.prefix=/api/v1

# JWT is used for authentication. Needs a base64-encoded 256-bit secret
# key and session expiration time in milliseconds. (86400000 ms is 24 hours.)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

project.admin.email=${ADMIN_EMAIL:admin1@augustana.edu}
project.admin.password=${ADMIN_PASSWORD:admin}
project.admin.name=${ADMIN_NAME:Administrator}

spring.mail.host = smtp.gmail.com
spring.mail.port = 587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
